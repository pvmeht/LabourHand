<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details – LabourHand</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- Header -->
<header class="bg-white border-bottom sticky-top" style="z-index:200;">
  <div class="d-flex align-items-center px-3 py-2 gap-3" style="max-width:900px;margin:auto;">
    <button onclick="history.back()" class="btn btn-sm btn-outline-secondary">&larr; Back</button>
    <h6 class="mb-0 fw-bold flex-grow-1" id="hdr-title">Project Details</h6>
  </div>
</header>

<div class="px-3 py-3 lh-page-body" style="max-width:900px;margin:auto;">

  <!-- Project card -->
  <div id="project-card">
    <!-- JS-rendered -->
  </div>

  <!-- Bids section -->
  <section class="mb-4" id="bids-section" style="display:none;">
    <h5 class="lh-section-title">Bids Received</h5>
    <div id="bids-table"><!-- JS bids table --></div>
  </section>

  <!-- Place a Bid (worker) -->
  <section id="place-bid-section" style="display:none;">
    <div class="lh-card p-4">
      <h5 class="lh-section-title">Place Your Bid</h5>
      <div id="bid-success" class="alert alert-success d-none py-2 small"></div>
      <div id="bid-error"   class="alert alert-danger  d-none py-2 small"></div>
      <form id="bid-form">
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label class="form-label fw-medium">Your Bid Amount (₹)</label>
            <input type="number" id="bid-amount" class="form-control" placeholder="12000" required />
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-medium">Estimated Days</label>
            <input type="number" id="bid-days" class="form-control" placeholder="7" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Proposal Message</label>
          <textarea id="bid-message" class="form-control" rows="3" placeholder="Describe your experience and approach…" required></textarea>
        </div>
        <button type="submit" class="btn fw-semibold px-4" style="background:var(--lh-primary);color:#fff;" id="bid-submit">
          Submit Bid
        </button>
      </form>
    </div>
  </section>

</div>

<!-- Bottom Nav -->
<nav class="lh-bottom-nav d-md-none">
  <a href="dashboard.html">🏠<span>Home</span></a>
  <a href="my-bids.html">📋<span>My Bids</span></a>
  <a href="messages.html">💬<span>Messages</span></a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/session.js"></script>
<script src="js/router.js"></script>
<script src="js/apiService.js"></script>
<script src="js/dataMapper.js"></script>
<script src="js/mockTest.js"></script>
<script>
  Router.requireAuth();

  const projectId = Router.param('id');
  const user      = SessionManager.getCurrentUser();
  const isOwner   = user?.role === 'owner';

  async function loadProject() {
    DataMapper.showSpinner('#project-card');
    try {
      const p = await Api.project.getById(projectId);
      document.getElementById('hdr-title').textContent = p.title;

      document.getElementById('project-card').innerHTML = `
        <div class="lh-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h4 class="fw-bold mb-0">${p.title}</h4>
            ${DataMapper.statusBadge(p.status)}
          </div>
          <p class="text-muted mb-3">${p.description || ''}</p>
          <div class="row g-3 mb-3">
            <div class="col-6 col-md-3">
              <small class="text-muted d-block">Budget</small>
              <span class="fw-bold" style="color:var(--lh-primary)">${DataMapper.currency(p.budget)}</span>
            </div>
            <div class="col-6 col-md-3">
              <small class="text-muted d-block">Timeline</small>
              <span class="fw-bold">${p.timelineDays || '?'} days</span>
            </div>
            <div class="col-6 col-md-3">
              <small class="text-muted d-block">Category</small>
              <span class="fw-bold">${p.category || '—'}</span>
            </div>
            <div class="col-6 col-md-3">
              <small class="text-muted d-block">Bids</small>
              <span class="fw-bold">${p.bidCount || 0}</span>
            </div>
          </div>
          <div class="mb-3">
            <small class="text-muted">📍 ${p.location}</small>
            ${p.distanceKm != null ? `<small class="ms-3 text-secondary fw-semibold">${p.distanceKm.toFixed(1)} km away</small>` : ''}
          </div>
          <div class="mb-1"><small class="text-muted">Progress</small></div>
          ${DataMapper.progressBar(p.progress || 0)}
          <div class="mt-3 d-flex gap-2 flex-wrap">
            <span class="badge bg-light text-dark">Posted ${DataMapper.timeAgo(p.postedAt)}</span>
            <span class="badge bg-light text-dark">By ${p.ownerName || 'Owner'}</span>
            ${p.deadline ? `<span class="badge bg-light text-dark">Deadline ${p.deadline}</span>` : ''}
          </div>
        </div>`;

      // Owner: show bids
      if (isOwner) {
        document.getElementById('bids-section').style.display = '';
        loadBids(p.id);
      } else if (p.status === 'OPEN_FOR_BIDS') {
        // Worker: show bid form
        document.getElementById('place-bid-section').style.display = '';
        document.getElementById('bid-form').dataset.projectId = p.id;
      }
    } catch (err) {
      DataMapper.showError('#project-card', `Could not load project: ${err.message}`);
    }
  }

  async function loadBids(pid) {
    DataMapper.showSpinner('#bids-table');
    try {
      const bids = await Api.bid.getProjectBids(pid);
      DataMapper.toTable('#bids-table', bids, [
        { label: 'Worker',   key: 'workerName' },
        { label: 'Amount',   key: 'amount',        render: v => DataMapper.currency(v) },
        { label: 'Days',     key: 'estimatedDays' },
        { label: 'Rating',   key: 'workerRating',  render: v => `⭐ ${v}` },
        { label: 'Status',   key: 'status',        render: v => DataMapper.statusBadge(v) },
        { label: 'Actions',  key: 'id',            render: (id, row) =>
            row.status === 'PENDING'
              ? `<button class='btn btn-sm btn-success me-1' onclick='acceptBid(${id})'>Accept</button>
                 <button class='btn btn-sm btn-outline-danger' onclick='rejectBid(${id})'>Reject</button>`
              : '—'
        },
      ]);
    } catch { DataMapper.showError('#bids-table', 'Could not load bids.'); }
  }

  async function acceptBid(id) {
    if (!confirm('Accept this bid?')) return;
    try { await Api.bid.accept(id); location.reload(); }
    catch (err) { alert(`Error: ${err.message}`); }
  }
  async function rejectBid(id) {
    if (!confirm('Reject this bid?')) return;
    try { await Api.bid.reject(id); location.reload(); }
    catch (err) { alert(`Error: ${err.message}`); }
  }

  /* Place bid form */
  document.getElementById('bid-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn    = document.getElementById('bid-submit');
    const errBox = document.getElementById('bid-error');
    const okBox  = document.getElementById('bid-success');
    errBox.classList.add('d-none');
    okBox.classList.add('d-none');
    btn.disabled = true; btn.textContent = 'Submitting…';

    try {
      await Api.bid.place({
        projectId:    Number(projectId),
        amount:       Number(document.getElementById('bid-amount').value),
        estimatedDays: Number(document.getElementById('bid-days').value),
        message:      document.getElementById('bid-message').value.trim(),
      });
      okBox.textContent = '✅ Bid placed successfully!';
      okBox.classList.remove('d-none');
      document.getElementById('bid-form').reset();
    } catch (err) {
      errBox.textContent = `Failed to place bid: ${err.message}`;
      errBox.classList.remove('d-none');
    } finally {
      btn.disabled = false; btn.textContent = 'Submit Bid';
    }
  });

  if (!projectId) {
    document.getElementById('project-card').innerHTML = '<div class="alert alert-warning">No project ID provided.</div>';
  } else {
    loadProject();
  }
</script>
</body>
</html>
